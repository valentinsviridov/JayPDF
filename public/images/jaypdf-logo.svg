<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="jayBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="jaySky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="jayNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Friendly Soft Body/Shoulders -->
  <path d="M 28 112 C 28 92 42 86 60 86 C 78 86 92 92 92 112 Z" fill="url(#jayBlue)" />
  <!-- White Chest Bib -->
  <path d="M 44 92 C 52 92 60 102 60 112 C 60 102 68 92 76 92 C 72 108 48 108 44 92 Z" fill="#ffffff" />

  <!-- Left Maine Coon Ear (Soft curved with gentle tuft) -->
  <path d="M 34 50 C 26 36 20 20 25 14 C 31 16 42 26 50 36 Z" fill="url(#jayBlue)" stroke="#1e293b" stroke-width="2" stroke-linejoin="round" />
  <!-- Left Lynx Tuft Tip (Soft rounded feather tuft) -->
  <path d="M 23 15 C 19 9 22 5 25 7 C 27 9 26 13 25 15" fill="url(#jaySky)" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <!-- Left Inner Ear -->
  <path d="M 33 44 C 29 34 26 23 29 19 C 33 22 39 28 44 34 Z" fill="url(#jaySky)" />

  <!-- Right Maine Coon Ear (Soft curved with gentle tuft) -->
  <path d="M 86 50 C 94 36 100 20 95 14 C 89 16 78 26 70 36 Z" fill="url(#jayBlue)" stroke="#1e293b" stroke-width="2" stroke-linejoin="round" />
  <!-- Right Lynx Tuft Tip -->
  <path d="M 97 15 C 101 9 98 5 95 7 C 93 9 94 13 95 15" fill="url(#jaySky)" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <!-- Right Inner Ear -->
  <path d="M 87 44 C 91 34 94 23 91 19 C 87 22 81 28 76 34 Z" fill="url(#jaySky)" />

  <!-- Head Base (Soft round Maine Coon cheeks & fluffy ruff) -->
  <path d="M 32 46 C 18 56 16 72 26 80 C 34 86 44 88 60 88 C 76 88 86 86 94 80 C 104 72 102 56 88 46 C 80 38 40 38 32 46 Z" fill="url(#jayBlue)" stroke="#1e293b" stroke-width="2" />

  <!-- Fluffy White Cheek Highlights -->
  <path d="M 25 74 C 22 68 24 60 30 56 C 32 64 36 72 44 76 C 36 78 28 78 25 74 Z" fill="#ffffff" />
  <path d="M 95 74 C 98 68 96 60 90 56 C 88 64 84 72 76 76 C 84 78 92 78 95 74 Z" fill="#ffffff" />

  <!-- Forehead Blue Jay Crest Markings (Gentle curves) -->
  <path d="M 52 38 C 56 34 64 34 68 38 C 65 48 55 48 52 38 Z" fill="url(#jayNavy)" opacity="0.8" />
  <path d="M 44 44 C 48 40 54 42 56 46 C 50 48 46 48 44 44 Z" fill="url(#jaySky)" />
  <path d="M 76 44 C 72 40 66 42 64 46 C 70 48 74 48 76 44 Z" fill="url(#jaySky)" />

  <!-- Cute Big Friendly Eyes -->
  <!-- Left Eye -->
  <ellipse cx="44" cy="58" rx="8" ry="9" fill="#0f172a" />
  <ellipse cx="44" cy="58" rx="6.5" ry="7.5" fill="url(#jaySky)" />
  <ellipse cx="44" cy="58" rx="4.5" ry="5.5" fill="#0f172a" />
  <!-- Sparkles -->
  <circle cx="41.5" cy="54.5" r="2.5" fill="#ffffff" />
  <circle cx="46.5" cy="61" r="1.2" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="76" cy="58" rx="8" ry="9" fill="#0f172a" />
  <ellipse cx="76" cy="58" rx="6.5" ry="7.5" fill="url(#jaySky)" />
  <ellipse cx="76" cy="58" rx="4.5" ry="5.5" fill="#0f172a" />
  <!-- Sparkles -->
  <circle cx="73.5" cy="54.5" r="2.5" fill="#ffffff" />
  <circle cx="78.5" cy="61" r="1.2" fill="#ffffff" />

  <!-- Cute White Muzzle (Soft rounded pads) -->
  <path d="M 60 67 C 54 67 48 70 48 76 C 48 81 54 84 60 81 C 66 84 72 81 72 76 C 72 70 66 67 60 67 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Tiny Cute Nose (Soft triangle) -->
  <path d="M 57 68 C 58 66.5 62 66.5 63 68 C 63.5 69.5 60.8 72 60 72 C 59.2 72 56.5 69.5 57 68 Z" fill="#0f172a" />
  
  <!-- Happy Cat Smile (:3 mouth) -->
  <path d="M 54 75 C 56 77.5 59 77.5 60 75 C 61 77.5 64 77.5 66 75" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Soft Whiskers -->
  <path d="M 44 73 C 34 71 24 72 16 76" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 44 77 C 35 78 26 82 18 87" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 76 73 C 86 71 96 72 104 76" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 76 77 C 85 78 94 82 102 87" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
</svg>
