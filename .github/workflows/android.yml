name: Android build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build a signed AAB using repository secrets (does not publish to Play)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: bun install --frozen-lockfile
      - run: bun run lint && bunx tsc --noEmit && bun run test:unit
      - run: bun run android:prepare
      - run: bunx --no-install playwright install --with-deps chromium webkit
      - run: bun run test:save
      - run: bun run android:test-web
      - run: ./gradlew assembleDebug assembleDebugAndroidTest lintDebug
        working-directory: android
      - run: bun scripts/check-android.mjs android/app/build/outputs/apk/debug/app-debug.apk
      - name: Archive matching source
        run: git archive --format=zip --prefix=jaypdf-source/ --output=jaypdf-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: jaypdf-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            jaypdf-source.zip
      - name: Build signed Play bundle
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        env:
          JAYPDF_UPLOAD_KEYSTORE_BASE64: ${{ secrets.JAYPDF_UPLOAD_KEYSTORE_BASE64 }}
          JAYPDF_KEYSTORE_PASSWORD: ${{ secrets.JAYPDF_KEYSTORE_PASSWORD }}
          JAYPDF_KEY_ALIAS: ${{ secrets.JAYPDF_KEY_ALIAS }}
          JAYPDF_KEY_PASSWORD: ${{ secrets.JAYPDF_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${JAYPDF_UPLOAD_KEYSTORE_BASE64:?Missing upload keystore secret}"
          export JAYPDF_KEYSTORE_FILE="$RUNNER_TEMP/jaypdf-upload.jks"
          trap 'rm -f "$JAYPDF_KEYSTORE_FILE"' EXIT
          printf '%s' "$JAYPDF_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$JAYPDF_KEYSTORE_FILE"
          chmod 600 "$JAYPDF_KEYSTORE_FILE"
          cd android
          ./gradlew bundleRelease lintRelease
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        with:
          name: jaypdf-play-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/reports/lint-results-release.html
            jaypdf-source.zip
